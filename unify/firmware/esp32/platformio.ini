; UNIFY-RUL sensor node — ESP32 DevKit V1
; Platform pinned: espressif32@6.5.0 ships arduino-esp32 2.0.14.
; Do NOT bump to 7.x/arduino-esp32 3.x without fixing the timer API (see main.cpp).
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
